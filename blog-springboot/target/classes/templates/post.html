<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - Mooyeali Code Den'">文章详情 - Mooyeali Code Den</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .search-form {
            text-align: center;
            margin: 20px 0;
        }
        .search-form input[type="text"] {
            padding: 8px;
            width: 300px;
            border: 1px solid #ccc;
        }
        .search-form input[type="submit"] {
            padding: 8px 16px;
            background-color: #1a9be6;
            color: white;
            border: none;
            cursor: pointer;
        }
        .sidebar {
            background-color: #CCD0D9;
            padding: 20px;
            margin-top: 20px;
        }
        .sidebar h3 {
            background-color: #03151F;
            color: #CCD0D9;
            padding: 10px;
            margin: 0 0 10px 0;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar li {
            margin: 10px 0;
            padding: 5px 0;
            border-bottom: 1px dotted #ccc;
        }
        .sidebar a {
            text-decoration: none;
            color: #020C16;
        }
        .sidebar a:hover {
            color: #1a9be6;
        }
        .admin-link {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #1a9be6;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
        }
        .post-meta {
            color: #666;
            font-size: 12px;
            margin: 10px 0;
            padding: 10px;
            background-color: #f5f5f5;
            border-left: 4px solid #1a9be6;
        }
        .post-content {
            line-height: 1.6;
            margin: 20px 0;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
        }
        .back-link {
            display: inline-block;
            margin: 20px 0;
            padding: 8px 16px;
            background-color: #1a9be6;
            color: white;
            text-decoration: none;
            border-radius: 3px;
        }
        .back-link:hover {
            background-color: #0d7bc4;
        }
    </style>
</head>
<body>
    <div id="bigbox">
        <a href="/admin" class="admin-link">管理后台</a>
        
        <h1>欢迎来到 Mooyeali Code Den 的世界</h1>
        
        <div class="search-form">
            <form th:action="@{/search}" method="get">
                <input type="text" name="keyword" placeholder="搜索文章...">
                <input type="submit" value="搜索">
            </form>
        </div>
        
        <div id="box" style="display: flex;">
            <div style="flex: 2; margin-right: 20px;">
                <a href="/" class="back-link">← 返回首页</a>
                
                <div id="box1">
                    <h2 th:text="${post.title}">文章标题</h2>
                    
                    <div class="post-meta">
                        <span th:text="'发布时间: ' + ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        <span th:text="' | 浏览次数: ' + ${post.viewCount}"></span>
                        <span th:if="${post.updatedAt}" th:text="' | 更新时间: ' + ${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                    
                    <div class="post-content">
                        <p><strong>摘要:</strong> <span th:text="${post.summary}">文章摘要</span></p>
                        <hr>
                        <div th:utext="${#strings.replace(post.content, T(System).lineSeparator(), '<br/>')}">文章内容</div>
                    </div>
                </div>
            </div>
            
            <div style="flex: 1;">
                <div class="sidebar" th:if="${recentPosts}">
                    <h3>最新文章</h3>
                    <ul>
                        <li th:each="recentPost : ${recentPosts}">
                            <a th:href="@{/post/{id}(id=${recentPost.id})}" th:text="${recentPost.title}">文章标题</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        <footer>
            <p>版权所有©Mooyeali</p>
        </footer>
    </div>
</body>
</html>
